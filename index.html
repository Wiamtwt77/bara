<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحكمة السرية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>⚖️ المحكمة السرية</h1>
      <div id="player-status">
        <span id="player-name">اللاعب: جاري التحميل...</span> | 
        <span>العملات: <strong id="coin-count">0</strong> 🪙</span>
      </div>
    </header>

    <main>
      <!-- قسم الدليل الذكي -->
      <section class="card-panel evidence-section">
        <h2>📜 دليل الجولة (AI)</h2>
        <p id="evidence-text">بانتظار وقوع الأحداث لتوليد الدليل...</p>
        <button id="btn-generate-evidence" onclick="triggerAIEvidence()">كشف دليل الجولة</button>
      </section>

      <!-- قسم متجر البطاقات والمخزون -->
      <section class="card-panel">
        <h2>🃏 بطاقاتك الحالية</h2>
        <div id="inventory-list" class="cards-grid"></div>
        
        <div class="shop-actions">
          <h3>شراء بطاقة عشوائية</h3>
          <button onclick="buyCard(1)">شراء فئة عادية (1 عملة)</button>
          <button onclick="buyCard(4)">شراء فئة قوية (4 عملات)</button>
        </div>
      </section>

      <!-- قسم التحالفات -->
      <section class="card-panel">
        <h2>🤝 نظام التحالفات</h2>
        <div id="alliance-status">حالة التحالف: مستقل</div>
        <select id="alliance-target-select"></select>
        <button onclick="sendAllianceRequest()">إرسال طلب تحالف</button>
      </section>

      <!-- قسم التصويت الجماعي -->
      <section class="card-panel">
        <h2>🗳️ التصويت الجماعي</h2>
        <select id="vote-target-select"></select>
        <button class="danger-btn" onclick="submitVote()">تصويت ضد المشتبه به</button>
        <div id="vote-results"></div>
      </section>
    </main>

    <!-- سجل الأحداث السري للجولة -->
    <aside class="log-panel">
      <h3>📋 تحركات الجولة الحالية</h3>
      <ul id="round-log"></ul>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
