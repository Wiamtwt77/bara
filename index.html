<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>المحكمة السرية — الأدوار الملعونة</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--panel2:#1a2236;--border:#2d3748;--text:#f7fafc;--muted:#a0aec0;
--gold:#ecc94b;--intel:#4299e1;--influence:#9f7aea;--danger:#f56565;--good:#48bb78;--accent:#ed8936;--curse:#e53e3e;}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(159,122,234,.12),transparent 30%),radial-gradient(circle at 95% 100%,rgba(237,137,54,.08),transparent 30%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer;transition:.15s}button:disabled{opacity:.35;cursor:not-allowed}
.shell{width:min(980px,calc(100% - 24px));margin:auto;padding:22px 0 50px}
.center{min-height:100vh;display:grid;place-items:center}

.hero{text-align:center;margin-bottom:26px}
.eyebrow{display:inline-block;border:1px solid var(--border);background:#0f1525;color:var(--influence);border-radius:999px;padding:8px 16px;font-size:13px;margin-bottom:14px;font-weight:700}
h1{margin:0;font-size:clamp(32px,6vw,56px);letter-spacing:-1px}
h2,h3{margin-top:0;font-weight:700}
.muted,.hint{color:var(--muted)}.hint{font-size:13px;margin-top:8px}

.panel,.private-box{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.setup{width:min(640px,100%);margin:auto}

.count-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 18px}
.count-btn,.btn{border:1px solid var(--border);color:var(--text);background:var(--panel2);border-radius:14px;padding:14px 16px;font-weight:600}
.count-btn.active,.btn.primary{background:linear-gradient(135deg,var(--influence),#805ad5);border-color:transparent}
.btn.danger{background:linear-gradient(135deg,var(--danger),#c53030);border-color:transparent}
.btn.good{background:linear-gradient(135deg,var(--good),#2f855a);border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d69e2e);border-color:transparent;color:#1a202c}
.btn.curse{background:linear-gradient(135deg,var(--curse),#9b2c2c);border-color:transparent}
.btn.full{width:100%}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.round{color:var(--influence);font-size:13px;font-weight:800;background:rgba(159,122,234,.1);padding:6px 12px;border-radius:999px}
.topbar h1{font-size:28px;margin:4px 0 0}

.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.player{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;transition:.2s}
.player.dead{opacity:.25;filter:grayscale(1)}
.player.winner{border-color:var(--gold);box-shadow:0 0 20px rgba(236,201,75,.15)}
.player-name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.role-badge{font-size:11px;background:rgba(159,122,234,.15);color:var(--influence);padding:2px 8px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:12px}
.stat{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.2);padding:6px 8px;border-radius:8px}
.stat.gold{color:var(--gold)}.stat.influence{color:var(--influence)}.stat.hp{color:var(--danger)}

.hand{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card-mini{width:36px;height:48px;border-radius:8px;display:grid;place-items:center;font-size:20px;border:1px solid var(--border);background:var(--panel)}
.card-mini.curse{border-color:var(--curse);background:rgba(229,62,62,.15)}

.event{text-align:center;border:1px solid var(--border);background:var(--panel2);border-radius:20px;padding:24px}
.event-icon{font-size:44px;margin-bottom:8px}
.event h2{font-size:26px;margin:8px 0}
.clues{display:grid;gap:8px;margin-top:16px}
.clue{border:1px solid var(--border);background:rgba(66,153,225,.08);border-radius:12px;padding:12px 14px;color:#bee3f8;font-size:14px}
.twist{border:1px solid rgba(237,137,54,.3);background:rgba(237,137,54,.08);color:#fbd38d;padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14px}

.actions,.private-actions{display:grid;gap:10px;margin-top:16px}
.private-screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.private-box{width:min(640px,100%);text-align:center}
.private-icon{font-size:56px;margin-bottom:10px}
.private-action{display:block;width:100%;text-align:right;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;position:relative}
.private-action strong{display:block;margin-bottom:6px;font-size:16px}
.private-action small{color:var(--muted);line-height:1.6;display:block}
.private-action:hover:not(:disabled){border-color:var(--influence);background:rgba(159,122,234,.06)}
.private-action.curse{border-color:var(--curse);background:rgba(229,62,62,.08)}
.private-action.curse:hover{border-color:var(--curse);background:rgba(229,62,62,.15)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{min-height:150px;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;border:1px solid var(--border);border-radius:18px;background:var(--panel2);color:var(--text);padding:14px;transition:.15s}
.card:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.card.curse{border-color:var(--curse);background:rgba(229,62,62,.08)}
.card.curse:hover{border-color:var(--curse);background:rgba(229,62,62,.15)}
.card strong{font-size:32px}
.card .type{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.card .desc{font-size:12px;color:var(--muted);line-height:1.5}

.log{margin-top:18px}
.log-item{padding:10px 0;border-bottom:1px solid var(--border);color:#cbd5e1;font-size:13px}

.loading{display:grid;place-items:center;min-height:220px;text-align:center}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--influence);animation:b .8s infinite alternate}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes b{to{transform:translateY(-8px);opacity:.35}}

.info-box{border:1px solid rgba(66,153,225,.3);background:rgba(66,153,225,.08);color:#bee3f8;padding:14px;border-radius:14px;margin:14px 0;font-size:14px}
.notice{border:1px solid rgba(237,137,54,.3);background:rgba(237,137,54,.08);color:#fbd38d;padding:14px;border-radius:14px;margin-top:14px}
.danger-box{border:1px solid rgba(245,101,101,.4);background:rgba(245,101,101,.08);color:#feb2b2;padding:14px;border-radius:14px;margin-top:14px}

.reveal-grid{display:grid;gap:10px;margin-top:16px}
.reveal-item{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.reveal-item .icon{font-size:28px}
.reveal-item .text{flex:1}
.reveal-item .text strong{display:block;font-size:15px}
.reveal-item .text small{color:var(--muted);font-size:12px}

.vote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.vote-btn{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;color:var(--text);font-weight:700}
.vote-btn:hover{border-color:var(--danger);background:rgba(245,101,101,.08)}
.vote-btn.voted{border-color:var(--danger);background:rgba(245,101,101,.12)}
.vote-count{font-size:24px;font-weight:800;color:var(--danger);margin-top:6px}

.phase-indicator{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.phase-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.phase-dot.active{background:var(--influence);box-shadow:0 0 8px var(--influence)}
.phase-dot.done{background:var(--good)}

.role-card{background:var(--panel2);border:2px solid var(--influence);border-radius:20px;padding:24px;text-align:center;margin:16px 0}
.role-card .role-icon{font-size:64px;margin-bottom:12px}
.role-card h2{color:var(--influence);margin:8px 0}
.role-card .role-goal{font-size:18px;color:var(--gold);font-weight:700;margin:12px 0}
.role-card .role-power{font-size:14px;color:var(--muted);line-height:1.8}

.target-grid{display:grid;gap:10px;margin-top:16px}
.target-btn{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:right;color:var(--text);font-weight:700}
.target-btn:hover{border-color:var(--accent);background:rgba(237,137,54,.08)}

@media(max-width:650px){
.count-grid{grid-template-columns:repeat(3,1fr)}
.players{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ==================== GAME DATA ====================
const ROLES=[
  {id:"detective",name:"المحقق",icon:"🕵️",goal:"اجمع 3 أدلة (📜) للفوز",power:"كشف دور لاعب مجاناً مرة بالجولة",winCheck:(p)=>p.clues>=3,winText:"كشف الحقيقة!"},
  {id:"killer",name:"القاتل",icon:"🗡️",goal:"اقتل لاعبين (أوصل حياتهم لصفر)",power:"هجومك لا يكلف شيئاً (مجاني)",winCheck:(p,g)=>(g.killsBy?.[p.id]||0)>=2,winText:"أنجز مهمته!"},
  {id:"merchant",name:"التاجر",icon:"💰",goal:"اجمع 10 ذهب للفوز",power:"السرقة تسرق 3 بدلاً من 2",winCheck:(p)=>p.gold>=10,winText:"بنى إمبراطوريته!"},
  {id:"politician",name:"السياسي",icon:"⭐",goal:"اجمع 5 نفوذ للفوز",power:"صوتك يحتسب ضعف",winCheck:(p)=>p.influence>=5,winText:"تسلق السلّة!"},
  {id:"rebel",name:"المنشق",icon:"🎭",goal:"كن آخر من يبقى حياً",power:"إذا وصلت لـ 1 ❤️ وتهاجم، تنجو",winCheck:(p,g)=>g.players.filter(x=>x.alive).length===1&&p.alive,winText:"البقاء للأقوى!"},
  {id:"guardian",name:"الحارس",icon:"🛡️",goal:"حمِّ لاعبك المكلف حياً حتى النهاية",power:"يمكنك حماية لاعباً مجاناً",winCheck:(p,g)=>{const w=g.players.find(x=>x.id===p.wardId);return w&&w.alive&&g.players.filter(x=>x.alive).length<=2;},winText:"أوفى بعهده!"}
];

const DECK=[
  {id:"attack",name:"هجوم",icon:"⚔️",type:"action",needsTarget:true,desc:"اختر لاعباً: يخسر 2 ❤️",effect:"attack",count:8},
  {id:"heal",name:"علاج",icon:"💊",type:"action",needsTarget:false,desc:"+2 ❤️ لك",effect:"heal",count:6},
  {id:"steal",name:"سرقة",icon:"💰",type:"action",needsTarget:true,desc:"اختر لاعباً: تسرق 2 💰",effect:"steal",count:6},
  {id:"shield",name:"درع",icon:"🛡️",type:"action",needsTarget:false,desc:"تحمي نفسك من هجوم هذه الجولة",effect:"shield",count:6},
  {id:"reveal",name:"كشف",icon:"🔍",type:"action",needsTarget:true,desc:"اختر لاعباً: تعرف دوره السري",effect:"reveal",count:4},
  {id:"clue",name:"دليل",icon:"📜",type:"resource",needsTarget:false,desc:"+1 دليل (للمحقق) أو بيعه بـ 1💰",effect:"clue",count:5},
  {id:"gold2",name:"ذهب",icon:"💎",type:"resource",needsTarget:false,desc:"+2 ذهب",effect:"gold2",count:8},
  {id:"influence",name:"نفوذ",icon:"🌟",type:"resource",needsTarget:false,desc:"+1 نفوذ",effect:"influence",count:6},
  {id:"bomb",name:"قنبلة",icon:"💣",type:"curse",needsTarget:false,desc:"استخدمها الآن (-1 ❤️) أو احتفظ بها... إذا وصلت يدك لـ 3 تنفجر (-3 ❤️)!",effect:"bomb",count:4},
  {id:"poison",name:"سم",icon:"☠️",type:"curse",needsTarget:false,desc:"استخدمه الآن (-1 ❤️) أو في نهاية الجولة تخسر 1 ❤️",effect:"poison",count:4},
  {id:"curse",name:"لعنة",icon:"🔥",type:"curse",needsTarget:false,desc:"استخدمها الآن (تفقد دورك لجولة) أو لا يمكنك السحب",effect:"curse",count:3}
];

const EVENTS=[
  {title:"ليلة العاصفة",story:"عاصفة أغلقت الأبواب. لا أحد يدخل أو يخرج.",twist:"لا يمكن استخدام ⚔️ هجوم هذه الجولة.",ban:"attack"},
  {title:"السوق السوداء",story:"تجار سرية ظهروا في الردهة.",twist:"كل لاعب يحصل على +1 💰 و +1 ⭐.",bonus:{gold:1,influence:1}},
  {title:"الخيانة المكشوفة",story:"وثيقة سرية تسربت. الثقة معدومة.",twist:"من يكشف دور لاعب يحصل على +1 ⭐.",revealBonus:true},
  {title:"الوباء",story:"مرض غامض ينتشر.",twist:"في نهاية الجولة، كل لاعب يخسر 1 ❤️.",plague:true},
  {title:"المزاد",story:"مزاد علني للنفوذ.",twist:"من يملك أكثر ذهباً يخسر 2 💰 ويكسب 2 ⭐.",auction:true},
  {title:"الهدنة",story:"هدنة مفاجئة.",twist:"لا يمكن استخدام ⚔️ هجوم أو ☠️ سم.",ban:"attack_poison"},
  {title:"الكنز المفقود",story:"عُثر على كنز في القبو.",twist:"أول لاعب يسحب 💎 ذهب يحصل على +3 💰 إضافية.",treasure:true},
  {title:"الانقلاب",story:"انقلاب داخلي!",twist:"القاتل والمحقق يتبادلان القوى هذه الجولة.",swapPowers:["killer","detective"]}
];

// ==================== STATE ====================
const state={
  screen:"setup",playerCount:4,players:[],round:1,phase:"setup",event:null,
  currentPlayerIndex:0,logs:[],loading:false,error:"",winner:null,
  deck:[],discard:[],pendingActions:{},gameOver:false,
  killsBy:{},revealedRoles:{},protectedThisRound:[],
  accusationVotes:{},useAI:false,currentDrawnCard:null
};
const app=document.getElementById("app");
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const alive=()=>state.players.filter(p=>p.alive);
const rand=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=(arr)=>[...arr].sort(()=>Math.random()-.5);

function buildDeck(){
  const deck=[];
  DECK.forEach(c=>{for(let i=0;i<c.count;i++)deck.push({...c,uid:c.id+"_"+i+"_"+Math.random().toString(36).slice(2,6)});});
  return shuffle(deck);
}

function render(){
  if(state.screen==="setup")return renderSetup();
  if(state.screen==="private")return renderPrivate();
  if(state.screen==="game")return renderGame();
}

function renderSetup(){
  app.innerHTML=`<main class="center"><div class="shell">
    <section class="hero">
      <div class="eyebrow">أدوار سرية + بطاقات ملعونة + أهداف مختلفة</div>
      <h1>المحكمة السرية</h1>
      <p>كل لاعب له دور سري وهدف فوز مختلف.<br>البطاقات ملعونة — احتفظ بها طويلاً وقد تنفجر!</p>
    </section>
    <section class="panel setup">
      <h2>⚙️ إعداد اللعبة</h2>
      <label class="hint">عدد اللاعبين (3–6)</label>
      <div class="count-grid">${[3,4,5,6].map(n=>`<button class="count-btn ${state.playerCount===n?"active":""}" data-count="${n}">${n}</button>`).join("")}</div>
      <div style="margin:14px 0">
        <label class="hint">أسماء اللاعبين</label>
        <div id="nameInputs" style="display:grid;gap:8px;margin-top:10px">${Array.from({length:state.playerCount},(_,i)=>`<input type="text" data-name="${i}" placeholder="اللاعب ${i+1}" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;width:100%;font:inherit" value="${esc(state.players[i]?.name||'')}">`).join("")}</div>
      </div>
      <button class="btn primary full" id="start">🚀 بدء اللعبة</button>
      ${state.error?`<div class="danger-box">${esc(state.error)}</div>`:""}
      <div class="info-box">
        <strong>🎯 كيف تُلعب:</strong><br>
        ١. كل لاعب يحصل على <strong>دور سري</strong> و<strong>هدف فوز مختلف</strong>.<br>
        ٢. كل جولة تسحب <strong>بطاقة</strong> — إما تستخدمها فوراً أو تحتفظ بها.<br>
        ٣. <strong>الحد: 3 بطاقات</strong> — إذا امتلأت يدك يجب استخدام واحدة!<br>
        ٤. <strong>البطاقات الملعونة</strong> (💣☠️🔥) إذا احتفظت بها... تنفجر!<br>
        ٥. في النهاية: <strong>اتهام</strong> + تحقق من شروط الفوز.
      </div>
      <div style="margin-top:16px">
        <h3>🎭 الأدوار السرية</h3>
        <div class="players" style="margin-top:10px">${ROLES.map(r=>`<article class="player"><div class="player-name">${r.icon} ${r.name}</div><div class="stats"><span class="stat gold">${r.goal}</span></div></article>`).join("")}</div>
      </div>
    </section>
  </div></main>`;
  document.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{state.playerCount=+b.dataset.count;renderSetupInputs()});
  document.getElementById("start").onclick=start;
  renderSetupInputs();
}

function renderSetupInputs(){
  const c=document.getElementById("nameInputs");
  if(!c)return;
  c.innerHTML=Array.from({length:state.playerCount},(_,i)=>`<input type="text" data-name="${i}" placeholder="اللاعب ${i+1}" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;width:100%;font:inherit" value="${esc(state.players[i]?.name||'')}">`).join("");
}

async function start(){
  const inputs=document.querySelectorAll("[data-name]");
  const names=Array.from(inputs).map((inp,i)=>inp.value.trim()||"اللاعب "+(i+1));
  if(names.length<3){state.error="تحتاج 3 لاعبين على الأقل!";render();return;}

  state.players=names.map((name,i)=>({
    id:i+1,name,hp:5,gold:2,influence:0,clues:0,
    role:null,roleRevealed:false,wardId:null,
    hand:[],alive:true,cursed:false,cantDraw:false
  }));
  state.round=1;state.phase="roles";state.logs=[];state.error="";state.winner=null;
  state.deck=buildDeck();state.discard=[];state.killsBy={};state.revealedRoles={};
  state.gameOver=false;state.screen="game";

  const shuffledRoles=shuffle(ROLES).slice(0,state.players.length);
  state.players.forEach((p,i)=>{
    p.role=shuffledRoles[i];
    if(p.role.id==="guardian"){
      const targets=state.players.filter(x=>x.id!==p.id);
      p.wardId=rand(targets).id;
    }
  });

  state.logs.push("🎭 توزيع الأدوار السرية...");
  state.event=rand(EVENTS);
  render();
}

function renderGame(){
  const phaseNames={roles:"الأدوار",event:"حدث الجولة",draw:"السحب",reveal:"الكشف",accuse:"الاتهام",end:"نهاية الجولة"};
  const phaseOrder=["roles","event","draw","reveal","accuse","end"];
  const phaseIndex=phaseOrder.indexOf(state.phase);

  app.innerHTML=`<main class="shell">
    <header class="topbar">
      <div><div class="round">الجولة ${state.round} — ${phaseNames[state.phase]||""}</div><h1>المحكمة السرية</h1></div>
      <button class="btn" id="restart">إعادة</button>
    </header>
    <div class="phase-indicator">${phaseOrder.map((ph,i)=>`<div class="phase-dot ${i===phaseIndex?"active":i<phaseIndex?"done":""}" title="${phaseNames[ph]}"></div>`).join("")}</div>
    <section class="players">${state.players.map(p=>{
      const known=state.revealedRoles[p.id];
      return `<article class="player ${p.alive?"":"dead"} ${p.id===state.winner?.id?"winner":""}">
        <div class="player-name">${known?p.role.icon+" ":""}${esc(p.name)} ${known?`<span class="role-badge">${p.role.name}</span>`:""}</div>
        <div class="stats">
          <span class="stat hp">❤️ ${p.hp}</span>
          <span class="stat gold">💰 ${p.gold}</span>
          <span class="stat influence">⭐ ${p.influence}</span>
          ${p.role?.id==="detective"?`<span class="stat">📜 ${p.clues}</span>`:""}
        </div>
        <div class="hand">${p.hand.map(c=>`<span class="card-mini ${c.type==="curse"?"curse":""}">${c.icon}</span>`).join("")}</div>
      </article>`;
    }).join("")}</section>
    <section class="panel">${state.loading?renderLoading():renderPhase()}</section>
    ${state.logs.length?`<section class="panel log"><h3>📜 سجل اللعبة</h3>${state.logs.slice(-12).reverse().map(x=>`<div class="log-item">${x}</div>`).join("")}</section>`:""}
  </main>`;
  document.getElementById("restart")?.addEventListener("click",()=>{state.screen="setup";state.players=[];state.logs=[];state.error="";render();});
  bindPhase();
}

function renderLoading(){return `<div class="loading"><div><div class="dots"><i></i><i></i><i></i></div><div class="muted">جارِ التحضير...</div></div></div>`}

function renderPhase(){
  if(state.phase==="roles")return renderRolesPhase();
  if(state.phase==="event")return renderEventPhase();
  if(state.phase==="draw")return renderDrawPhase();
  if(state.phase==="reveal")return renderRevealPhase();
  if(state.phase==="accuse")return renderAccusePhase();
  if(state.phase==="end")return renderEndPhase();
}

function renderRolesPhase(){
  return `<div class="event"><div class="event-icon">🎭</div><h2>توزيع الأدوار السرية</h2>
  <p class="muted">كل لاعب له دور سري وهدف فوز مختلف. لا أحد يعرف دور الآخر!</p>
  <div class="info-box">⚠️ مرر الهاتف لكل لاعب ليرى دوره السري.</div>
  <div class="actions"><button class="btn primary full" id="viewRoles">عرض الأدوار (تمرير الهاتف)</button></div>`;
}

function renderEventPhase(){
  const e=state.event||{};
  return `<div class="event"><div class="event-icon">⚡</div><h2>${esc(e.title||"حدث غامض")}</h2><p>${esc(e.story||"")}</p></div>
  ${e.twist?`<div class="twist">🎭 ${esc(e.twist)}</div>`:""}
  <div class="actions"><button class="btn primary full" id="beginDraw">ابدأ السحب</button></div>`;
}

function renderDrawPhase(){
  const remaining=alive().filter(p=>!state.pendingActions[p.id]).length;
  return `<div class="event"><div class="event-icon">🃏</div><h2>سحب البطاقات</h2>
  <p class="muted">كل لاعب يسحب بطاقة. يمكنه استخدامها فوراً أو الاحتفاظ بها.</p>
  <div class="info-box">⏳ باقي ${remaining} لاعب${remaining===1?"":"ين"} لم يسحبوا بعد.<br>💡 الحد: 3 بطاقات. إذا امتلأت يدك يجب استخدام واحدة!</div>
  <div class="actions"><button class="btn primary full" id="nextPrivate">تمرير الهاتف — سحب البطاقة</button></div>`;
}

function renderRevealPhase(){
  const actions=Object.values(state.pendingActions);
  return `<h2>🔓 كشف الأفعال</h2>
  <div class="reveal-grid">${actions.map(a=>{
    const p=state.players.find(x=>x.id===a.playerId);
    const c=a.card;
    let res="";
    if(a.cancelled)res="<span style='color:var(--danger)'>⛔ أُلغي</span>";
    else if(a.blocked)res="<span style='color:var(--good)'>🛡️ حُمي</span>";
    else if(a.success===false)res="<span style='color:var(--danger)'>❌ فشل</span>";
    else if(a.success)res="<span style='color:var(--good)'>✅ نجح</span>";
    return `<div class="reveal-item"><div class="icon">${c.icon}</div><div class="text"><strong>${esc(p?.name||"???")} — ${esc(c.name)}</strong><small>${esc(c.desc)} ${res}</small></div></div>`;
  }).join("")}</div>
  <div class="actions"><button class="btn primary full" id="toAccuse">جولة الاتهام</button></div>`;
}

function renderAccusePhase(){
  const a=alive();
  return `<h2>⚖️ جولة الاتهام</h2>
  <p class="muted">ناقشوا ما رأيتم. من يُتهم؟ الأصوات سرية.</p>
  <div class="vote-grid">${a.map(p=>`<button class="vote-btn ${state.accusationVotes[state.currentPlayerIndex]===p.id?'voted':''}" data-vote="${p.id}"><div>${esc(p.name)}</div><div class="vote-count">${Object.values(state.accusationVotes).filter(v=>v===p.id).length} صوت</div></button>`).join("")}</div>
  <div class="info-box">صوتك: ${state.accusationVotes[state.currentPlayerIndex]?esc(state.players.find(p=>p.id===state.accusationVotes[state.currentPlayerIndex])?.name):"لم تختار بعد"}</div>
  <div class="actions"><button class="btn primary full" id="submitVote" ${state.accusationVotes[state.currentPlayerIndex]?"":"disabled"}>تأكيد الاتهام</button></div>`;
}

function renderEndPhase(){
  const a=alive();
  for(const p of a){
    if(p.role&&p.role.winCheck(p,state)){state.winner=p;state.gameOver=true;break;}
  }
  if(!state.gameOver&&a.length<=1){state.winner=a[0]||null;state.gameOver=true;}

  if(state.gameOver){
    return `<div class="event"><div class="event-icon">👑</div><h2>انتهت اللعبة</h2>
    <p>${state.winner?`${state.winner.role.icon} <strong>${esc(state.winner.name)}</strong> — ${esc(state.winner.role.winText)}`:"لا يوجد فائز."}</p>
    <div class="players" style="margin-top:20px">${state.players.map(p=>`<article class="player ${p.alive?"":"dead"} ${p.id===state.winner?.id?"winner":""}"><div class="player-name">${state.revealedRoles[p.id]?p.role.icon+" ":""}${esc(p.name)} ${state.revealedRoles[p.id]?`<span class="role-badge">${p.role.name}</span>`:""}</div><div class="stats"><span class="stat hp">❤️ ${p.hp}</span><span class="stat gold">💰 ${p.gold}</span><span class="stat influence">⭐ ${p.influence}</span>${p.role?.id==="detective"?`<span class="stat">📜 ${p.clues}</span>`:""}</div></article>`).join("")}</div>
    <button class="btn primary full" id="newGame" style="margin-top:20px">لعبة جديدة</button></div>`;
  }
  return `<div class="event"><div class="event-icon">🌙</div><h2>انتهت الجولة ${state.round}</h2>
  <p class="muted">تم تطبيق الانفجارات واللعنات.</p>
  <div class="info-box">${state.logs.slice(-6).map(l=>`<div>${l}</div>`).join("")}</div>
  <button class="btn primary full" id="nextRound">الجولة التالية</button></div>`;
}

function bindPhase(){
  document.getElementById("viewRoles")?.addEventListener("click",()=>{state.screen="private";state.currentPlayerIndex=0;state.phase="roles";render();});
  document.getElementById("beginDraw")?.addEventListener("click",()=>{state.phase="draw";state.currentPlayerIndex=0;state.pendingActions={};render();});
  document.getElementById("nextPrivate")?.addEventListener("click",()=>{state.screen="private";render();});
  document.getElementById("toAccuse")?.addEventListener("click",()=>{state.phase="accuse";state.currentPlayerIndex=0;state.accusationVotes={};render();});
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>castVote(+b.dataset.vote));
  document.getElementById("submitVote")?.addEventListener("click",submitVote);
  document.getElementById("nextRound")?.addEventListener("click",nextRound);
  document.getElementById("newGame")?.addEventListener("click",()=>{state.screen="setup";state.players=[];render();});
}

// ==================== PRIVATE SCREENS ====================
function renderPrivate(){
  const a=alive();
  if(!a.length){state.screen="game";state.phase="end";return render();}
  const p=a[state.currentPlayerIndex%a.length];
  if(state.phase==="roles")return renderPrivateRole(p,a);
  if(state.phase==="draw")return renderPrivateDraw(p,a);
}

function renderPrivateRole(p,a){
  const next=()=>{
    state.currentPlayerIndex++;
    if(state.currentPlayerIndex>=a.length){state.screen="game";state.phase="event";render();}
    else render();
  };
  const wardName=p.wardId?state.players.find(x=>x.id===p.wardId)?.name:"";
  app.innerHTML=`<main class="private-screen"><section class="private-box">
    <div class="private-icon">🎭</div><div class="eyebrow">سري — لا تُظهر للآخرين!</div>
    <div class="role-card">
      <div class="role-icon">${p.role.icon}</div>
      <h2>${p.role.name}</h2>
      <div class="role-goal">🎯 ${p.role.goal}</div>
      <div class="role-power">💡 ${p.role.power}</div>
      ${p.wardId?`<div class="notice" style="margin-top:12px">🛡️ يجب حماية: ${esc(wardName)}</div>`:""}
    </div>
    <button class="btn primary full" id="nextRole" style="margin-top:16px">فهمت — أعطِ الهاتف للتالي</button>
  </section></main>`;
  document.getElementById("nextRole").onclick=next;
}

function renderPrivateDraw(p,a){
  if(state.pendingActions[p.id]){nextDrawPlayer(a);return;}

  // Check curse
  if(p.cursed){
    app.innerHTML=`<main class="private-screen"><section class="private-box">
      <div class="private-icon">🔥</div><div class="eyebrow">سري — ${esc(p.name)}</div>
      <div class="danger-box"><strong>أنت ملعون!</strong><br>لا يمكنك سحب البطاقات. يجب كسر اللعنة.</div>
      <button class="btn curse full" id="breakCurse">كسر اللعنة (-1 ❤️)</button>
    </section></main>`;
    document.getElementById("breakCurse").onclick=()=>{
      p.hp=Math.max(0,p.hp-1);p.cursed=false;
      state.logs.push(`🔥 ${p.name} كسر لعنته! (-1 ❤️)`);
      if(p.hp===0)eliminate(p);
      nextDrawPlayer(a);
    };
    return;
  }

  // Draw card
  let card;
  if(state.deck.length===0){
    if(state.discard.length===0){
      app.innerHTML=`<main class="private-screen"><section class="private-box">
        <div class="private-icon">📭</div><h2>انتهت البطاقات!</h2>
        <p class="muted">لا يوجد بطاقات للسحب.</p>
        <button class="btn primary full" id="skipDraw">تخطي</button>
      </section></main>`;
      document.getElementById("skipDraw").onclick=()=>nextDrawPlayer(a);
      return;
    }
    state.deck=shuffle(state.discard);state.discard=[];
  }
  card=state.deck.pop();
  state.currentDrawnCard=card;

  const handFull=p.hand.length>=3;
  const needsTarget=card.needsTarget;

  app.innerHTML=`<main class="private-screen"><section class="private-box">
    <div class="private-icon">${card.icon}</div><div class="eyebrow">سري — ${esc(p.name)}</div>
    <h1 style="font-size:28px">سحبت: ${esc(card.name)}</h1>
    <div class="info-box" style="text-align:right;font-size:16px">
      <strong>${card.icon} ${esc(card.name)}</strong><br>
      <span style="color:var(--muted)">${esc(card.desc)}</span>
      ${card.type==="curse"?'<br><span style="color:var(--curse)">⚠️ بطاقة ملعونة!</span>':''}
    </div>
    ${handFull?`<div class="danger-box">⚠️ يدك ممتلئة (${p.hand.length}/3)! يجب استخدام هذه البطاقة!</div>`:""}
    <div class="info-box" style="text-align:right">❤️ ${p.hp} | 💰 ${p.gold} | ⭐ ${p.influence}${p.role?.id==="detective"?` | 📜 ${p.clues}`:""}</div>
    <div class="private-actions">
      ${needsTarget?`<button class="private-action" id="useTarget"><strong>⚡ استخدم الآن</strong><small>اختر هدفاً</small></button>`:`<button class="private-action" id="useNow"><strong>⚡ استخدم الآن</strong><small>نفذ الفعل فوراً</small></button>`}
      ${card.type==="resource"&&!handFull?`<button class="private-action" id="keepCard"><strong>💼 احتفظ بها</strong><small>أضفها ليدك (${p.hand.length}/3)</small></button>`:""}
      ${card.type==="curse"&&!handFull?`<button class="private-action curse" id="keepCard"><strong>🎲 احتفظ بها (خطير!)</strong><small>قد تنفجر إذا امتلأت يدك!</small></button>`:""}
      ${p.hand.length>0?`<button class="private-action" id="playHand"><strong>🎴 استخدم من يدك</strong><small>اختر بطاقة محفوظة</small></button>`:""}
    </div>
  </section></main>`;

  document.getElementById("useNow")?.addEventListener("click",()=>{
    applyCardEffect(p,card,null,a);
    state.pendingActions[p.id]={playerId:p.id,card:{...card},action:"use",success:true};
    state.discard.push(card);state.currentDrawnCard=null;
    nextDrawPlayer(a);
  });
  document.getElementById("useTarget")?.addEventListener("click",()=>selectTarget(p,card,a));
  document.getElementById("keepCard")?.addEventListener("click",()=>{
    if(p.hand.length>=3){alert("يدك ممتلئة!");return;}
    p.hand.push(card);
    state.pendingActions[p.id]={playerId:p.id,card:{...card},action:"keep",success:true};
    state.logs.push(`${p.name} احتفظ ببطاقة سراً.`);
    state.currentDrawnCard=null;
    nextDrawPlayer(a);
  });
  document.getElementById("playHand")?.addEventListener("click",()=>playFromHand(p,a));
}

function selectTarget(p,card,a){
  const targets=a.filter(x=>x.id!==p.id);
  app.innerHTML=`<main class="private-screen"><section class="private-box">
    <div class="private-icon">${card.icon}</div><h1 style="font-size:28px">اختر هدفك</h1>
    <p class="muted">${esc(card.name)} — ${esc(card.desc)}</p>
    <div class="target-grid">${targets.map(t=>`<button class="target-btn" data-target="${t.id}"><strong>${esc(t.name)}</strong><small>❤️ ${t.hp} | 💰 ${t.gold} | ⭐ ${t.influence}</small></button>`).join("")}</div>
    <button class="btn" id="backDraw" style="margin-top:10px">رجوع</button>
  </section></main>`;
  document.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{
    const targetId=+b.dataset.target;
    applyCardEffect(p,card,targetId,a);
    state.pendingActions[p.id]={playerId:p.id,card:{...card},action:"use",targetId,success:true};
    state.discard.push(state.currentDrawnCard);state.currentDrawnCard=null;
    nextDrawPlayer(a);
  });
  document.getElementById("backDraw").onclick=()=>renderPrivateDraw(p,a);
}

function playFromHand(p,a){
  if(p.hand.length===0)return;
  app.innerHTML=`<main class="private-screen"><section class="private-box">
    <div class="private-icon">🎴</div><h1 style="font-size:28px">اختر بطاقة من يدك</h1>
    <div class="cards">${p.hand.map((c,i)=>`<button class="card ${c.type==="curse"?"curse":""}" data-hand="${i}"><strong>${c.icon}</strong><span>${esc(c.name)}</span><span class="type">${c.type==="curse"?"ملعونة":c.type==="resource"?"مورد":"فعل"}</span><small class="muted">${esc(c.desc)}</small></button>`).join("")}</div>
    <button class="btn" id="backDraw" style="margin-top:10px">رجوع</button>
  </section></main>`;
  document.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.hand;
    const card=p.hand.splice(idx,1)[0];
    if(card.needsTarget){
      // Need target - show target selection
      const targets=a.filter(x=>x.id!==p.id);
      app.innerHTML=`<main class="private-screen"><section class="private-box">
        <div class="private-icon">${card.icon}</div><h1 style="font-size:28px">اختر هدفك</h1>
        <div class="target-grid">${targets.map(t=>`<button class="target-btn" data-target2="${t.id}"><strong>${esc(t.name)}</strong><small>❤️ ${t.hp} | 💰 ${t.gold}</small></button>`).join("")}</div>
      </section></main>`;
      document.querySelectorAll("[data-target2]").forEach(b2=>b2.onclick=()=>{
        const targetId=+b2.dataset.target2;
        applyCardEffect(p,card,targetId,a);
        state.pendingActions[p.id]={playerId:p.id,card:{...card},action:"hand",targetId,success:true};
        state.discard.push(card);state.currentDrawnCard=null;
        nextDrawPlayer(a);
      });
    }else{
      applyCardEffect(p,card,null,a);
      state.pendingActions[p.id]={playerId:p.id,card:{...card},action:"hand",success:true};
      state.discard.push(card);state.currentDrawnCard=null;
      nextDrawPlayer(a);
    }
  });
  document.getElementById("backDraw").onclick=()=>renderPrivateDraw(p,a);
}

function nextDrawPlayer(a){
  state.currentPlayerIndex++;
  if(state.currentPlayerIndex>=a.length){
    state.screen="game";state.phase="reveal";resolveRound();render();
  }else render();
}

// ==================== CARD EFFECTS ====================
function applyCardEffect(player,card,targetId,allPlayers){
  const banAttack=state.event?.ban==="attack"||state.event?.ban==="attack_poison";
  const target=targetId?state.players.find(p=>p.id===targetId):null;

  switch(card.effect){
    case "attack":
      if(banAttack){
        state.logs.push(`⚔️ هجوم ${player.name} مُحظور هذه الجولة!`);
        return false;
      }
      if(target&&target.alive){
        if(state.protectedThisRound.includes(target.id)){
          state.logs.push(`🛡️ ${target.name} حُمي من هجوم ${player.name}!`);
          return false;
        }
        if(target.role?.id==="rebel"&&target.hp<=1){
          state.logs.push(`🎭 ${target.name} (المنشق) نجا بأعجوبة!`);
          return false;
        }
        const dmg=player.role?.id==="killer"?3:2;
        target.hp=Math.max(0,target.hp-dmg);
        state.logs.push(`⚔️ ${player.name} هاجم ${target.name}! (-${dmg} ❤️)`);
        if(target.hp===0){
          eliminate(target);
          state.killsBy[player.id]=(state.killsBy[player.id]||0)+1;
          state.logs.push(`☠️ ${player.name} قتل ${target.name}!`);
        }
        return true;
      }
      return false;
    case "heal":
      player.hp=Math.min(5,player.hp+2);
      state.logs.push(`💊 ${player.name} عالج نفسه! (+2 ❤️)`);
      return true;
    case "steal":
      if(target&&target.alive&&target.gold>0){
        const amt=player.role?.id==="merchant"?3:2;
        const stolen=Math.min(amt,target.gold);
        target.gold-=stolen;player.gold+=stolen;
        state.logs.push(`💰 ${player.name} سرق ${stolen}💰 من ${target.name}!`);
        return true;
      }
      state.logs.push(`💰 ${player.name} فشل في السرقة!`);
      return false;
    case "shield":
      state.protectedThisRound.push(player.id);
      state.logs.push(`🛡️ ${player.name} جهز درعاً!`);
      return true;
    case "reveal":
      if(target&&target.alive){
        state.revealedRoles[target.id]=true;
        state.logs.push(`🔍 ${player.name} كشف دور ${target.name}: ${target.role.icon} ${target.role.name}!`);
        if(state.event?.revealBonus){
          player.influence++;
          state.logs.push(`⭐ ${player.name} حصل على +1 نفوذ لكشفه!`);
        }
        return true;
      }
      return false;
    case "clue":
      if(player.role?.id==="detective"){
        player.clues++;
        state.logs.push(`📜 ${player.name} وجد دليلاً! (${player.clues}/3)`);
      }else{
        player.gold+=1;
        state.logs.push(`📜 ${player.name} باع الدليل بـ 1💰.`);
      }
      return true;
    case "gold2":
      player.gold+=2;
      state.logs.push(`💎 ${player.name} حصل على 2💰!`);
      // Treasure event bonus
      if(state.event?.treasure&&state.currentDrawnCard?.effect==="gold2"){
        player.gold+=3;
        state.logs.push(`🏆 ${player.name} وجد الكنز! +3💰 إضافية!`);
        state.event.treasure=false; // Only once
      }
      return true;
    case "influence":
      player.influence++;
      state.logs.push(`🌟 ${player.name} حصل على 1⭐!`);
      return true;
    case "bomb":
      player.hp=Math.max(0,player.hp-1);
      state.logs.push(`💣 ${player.name} فجر القنبلة عن قصد! (-1 ❤️)`);
      if(player.hp===0)eliminate(player);
      return true;
    case "poison":
      player.hp=Math.max(0,player.hp-1);
      state.logs.push(`☠️ ${player.name} شرب السم للتخلص منه! (-1 ❤️)`);
      if(player.hp===0)eliminate(player);
      return true;
    case "curse":
      player.cursed=true;
      state.logs.push(`🔥 ${player.name} تحمل اللعنة! لا يمكنه السحب.`);
      return true;
  }
  return false;
}

// ==================== ROUND RESOLUTION ====================
function resolveRound(){
  const a=alive();

  // Check kept curse cards
  a.forEach(p=>{
    const bombs=p.hand.filter(c=>c.effect==="bomb");
    const poisons=p.hand.filter(c=>c.effect==="poison");

    // Bomb explosion at 3 cards
    if(bombs.length>0&&p.hand.length>=3){
      const bomb=bombs[0];
      p.hand=p.hand.filter(c=>c.uid!==bomb.uid);
      state.discard.push(bomb);
      p.hp=Math.max(0,p.hp-3);
      state.logs.push(`💥💣 يد ${p.name} امتلأت والقنبلة انفجرت! (-3 ❤️)`);
      if(p.hp===0)eliminate(p);
    }

    // Poison drain
    poisons.forEach(()=>{
      p.hp=Math.max(0,p.hp-1);
      state.logs.push(`☠️ السم ينخر ${p.name}! (-1 ❤️)`);
      if(p.hp===0)eliminate(p);
    });
  });

  // Event effects
  if(state.event?.plague){
    a.forEach(p=>{
      p.hp=Math.max(0,p.hp-1);
      state.logs.push(`🦠 الوباء يضعف ${p.name}! (-1 ❤️)`);
      if(p.hp===0)eliminate(p);
    });
  }
  if(state.event?.auction){
    const richest=a.filter(p=>p.gold>0).sort((x,y)=>y.gold-x.gold)[0];
    if(richest&&richest.gold>=2){
      richest.gold-=2;richest.influence+=2;
      state.logs.push(`🏛️ ${richest.name} فاز بالمزاد! (-2💰, +2⭐)`);
    }
  }
  if(state.event?.bonus){
    a.forEach(p=>{
      if(state.event.bonus.gold)p.gold+=state.event.bonus.gold;
      if(state.event.bonus.influence)p.influence+=state.event.bonus.influence;
    });
    state.logs.push(`🎁 الجميع حصل على مكافآت من الحدث!`);
  }

  state.protectedThisRound=[];
}

function eliminate(p){
  p.alive=false;p.hp=0;
  state.logs.push(`☠️ ${p.name} خرج من اللعبة!`);
  state.discard.push(...p.hand);
  p.hand=[];
}

// ==================== ACCUSATION ====================
function castVote(targetId){
  state.accusationVotes[state.currentPlayerIndex]=targetId;
  render();
}

function submitVote(){
  const a=alive();
  state.currentPlayerIndex++;
  if(state.currentPlayerIndex>=a.length){
    const votes={};
    Object.values(state.accusationVotes).forEach(v=>{votes[v]=(votes[v]||0)+1;});
    // Politician double vote
    a.forEach((p,i)=>{
      if(p.role?.id==="politician"){
        const v=state.accusationVotes[i];
        if(v)votes[v]=(votes[v]||0)+1;
      }
    });
    let max=0,accusedId=null;
    Object.entries(votes).forEach(([id,c])=>{if(c>max){max=c;accusedId=+id;}});

    if(accusedId){
      const accused=state.players.find(p=>p.id===accusedId);
      if(accused&&accused.alive){
        accused.influence=Math.max(0,accused.influence-1);
        state.logs.push(`⚖️ ${accused.name} متهم! خسر 1⭐.`);
        a.forEach((p,i)=>{
          if(state.accusationVotes[i]===accusedId&&p.id!==accusedId){
            p.influence++;
            state.logs.push(`✅ ${p.name} صوّت صح! +1⭐.`);
          }
        });
      }
    }
    state.phase="end";render();
  }else render();
}

// ==================== NEXT ROUND ====================
function nextRound(){
  state.round++;
  state.phase="event";
  state.currentPlayerIndex=0;
  state.pendingActions={};
  state.accusationVotes={};
  state.protectedThisRound=[];
  state.event=rand(EVENTS);
  render();
}

render();
</script>
