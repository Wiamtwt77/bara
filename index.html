<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محكمة الظلال - لعبة الاستراتيجية والتخريب</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-3xl font-black text-red-500 mb-2">محكمة الظلال</h1>
    <p class="text-slate-400 text-sm mb-6">التخريب الخفي، الاتهام الاستراتيجي، والانتقام المباشر عبر تمرير الهاتف.</p>
    
    <div id="game-container" class="space-y-4">
      <button onclick="startGame()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-red-900/30">
        إنشاء جلسة جديدة
      </button>
      <div id="phase-view" class="hidden text-right bg-slate-800/50 p-4 rounded-xl border border-slate-700">
        <h2 id="phase-title" class="font-bold text-red-400 mb-2">مرحلة تمرير الهاتف</h2>
        <p id="phase-desc" class="text-xs text-slate-300">أعط الهاتف للاعب التالي وقم بتنفيذ ضربتك أو تفعيل زر الذعر بحذر شديد.</p>
      </div>
    </div>
  </div>

  <script>
    function startGame() {
      document.getElementById('phase-view').classList.remove('hidden');
      fetch('/api/game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'init' })
      })
      .then(res => res.json())
      .then(data => console.log(data));
    }
  </script>
</body>
</html>
