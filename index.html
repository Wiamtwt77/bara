<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>المحكمة السرية</title>
  <style>
    :root{--bg:#090b12;--panel:#121724;--panel2:#171c2b;--border:#2a3245;--text:#f5f7fb;--muted:#9aa4b8;--accent:#8b5cf6;--danger:#b91c1c;--good:#15803d}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(139,92,246,.18),transparent 28%),radial-gradient(circle at 100% 100%,rgba(185,28,28,.1),transparent 28%),var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
    button{font:inherit;cursor:pointer}.shell{width:min(960px,calc(100% - 24px));margin:auto;padding:22px 0 50px}.center{min-height:100vh;display:grid;place-items:center}
    .hero{text-align:center;margin-bottom:22px}.eyebrow{display:inline-block;border:1px solid var(--border);background:#101421;color:#c4b5fd;border-radius:999px;padding:7px 12px;font-size:13px;margin-bottom:12px}
    h1{margin:0;font-size:clamp(34px,7vw,60px)}h2,h3{margin-top:0}.hero p,.muted,.hint{color:var(--muted);line-height:1.8}
    .panel,.private-box{background:rgba(18,23,36,.95);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.24)}
    .setup{width:min(620px,100%);margin:auto}.count-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 18px}
    .count-btn,.btn{border:1px solid var(--border);color:var(--text);background:var(--panel2);border-radius:13px;padding:13px 15px}.count-btn.active,.btn.primary{background:var(--accent);border-color:var(--accent)}
    .btn.danger{background:var(--danger);border-color:var(--danger)}.btn.good{background:var(--good);border-color:var(--good)}.btn.full{width:100%}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.round{color:#a78bfa;font-size:13px;font-weight:700}.topbar h1{font-size:30px;margin:3px 0 0}
    .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px;margin-bottom:15px}.player{background:#111625;border:1px solid var(--border);border-radius:15px;padding:11px}.player.dead{opacity:.34;filter:grayscale(1)}
    .player-name{font-weight:700;font-size:13px}.stats{color:#cbd5e1;font-size:12px;margin-top:6px;display:grid;gap:3px}
    .event{text-align:center;border:1px solid #343b52;background:#111624;border-radius:18px;padding:20px}.event-icon{font-size:42px}.event h2{font-size:28px;margin:7px 0}
    .clues{display:grid;gap:8px;margin-top:14px}.clue{border:1px solid var(--border);background:#111624;border-radius:13px;padding:11px 13px;color:#dbeafe}
    .actions,.private-actions,.targets{display:grid;gap:10px;margin-top:15px}.target{width:100%;display:flex;justify-content:space-between;text-align:right;background:#151a28;color:var(--text);border:1px solid var(--border);border-radius:15px;padding:15px}
    .private-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.private-box{width:min(620px,100%);text-align:center}.private-icon{font-size:52px}
    .private-action{display:block;width:100%;text-align:right;color:var(--text);background:#171c2b;border:1px solid var(--border);border-radius:15px;padding:14px}.private-action strong{display:block;margin-bottom:4px}.private-action small{color:var(--muted);line-height:1.7}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{min-height:120px;display:grid;place-items:center;align-content:center;gap:7px;text-align:center;border:1px solid var(--border);border-radius:16px;background:#151a28;color:var(--text);padding:12px}
    .log{margin-top:15px}.log-item{padding:9px 0;border-bottom:1px solid #202638;color:#cbd5e1;font-size:13px}.loading{display:grid;place-items:center;min-height:250px;text-align:center}
    .dots{display:flex;gap:6px;margin-bottom:10px}.dots i{width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:b .75s infinite alternate}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
    @keyframes b{to{transform:translateY(-7px);opacity:.4}}.error{border:1px solid #7f1d1d;background:#2a1114;color:#fecaca;padding:13px;border-radius:13px;margin-top:12px}.notice{border:1px solid #4c3a0d;background:#241d0b;color:#fde68a;padding:12px;border-radius:13px;margin-top:12px}
    @media(max-width:650px){.count-grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const state={
  screen:"setup",playerCount:4,players:[],round:1,phase:"event",event:null,
  currentPlayerIndex:0,logs:[],loading:false,error:""
};
const app=document.getElementById("app");
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const alive=()=>state.players.filter(p=>p.alive);

function render(){
  if(state.screen==="setup") return setup();
  if(state.screen==="private") return privateScreen();
  game();
}

function setup(){
  app.innerHTML=`
  <main class="center"><div class="shell">
    <section class="hero">
      <div class="eyebrow">لعبة اجتماعية + مدير ذكاء اصطناعي</div>
      <h1>المحكمة السرية</h1>
      <p>مرروا الهاتف. نفذوا أفعالاً سرية. اتهموا. تحالفوا. انتقموا. ولا يوجد جاسوس ثابت.</p>
    </section>
    <section class="panel setup">
      <h2>عدد اللاعبين</h2>
      <div class="count-grid">${[3,4,5,6,7,8].map(n=>`<button class="count-btn ${state.playerCount===n?"active":""}" data-count="${n}">${n}</button>`).join("")}</div>
      <button class="btn primary full" id="start">بدء اللعبة</button>
      ${state.error?`<div class="error">${esc(state.error)}</div>`:""}
      <p class="hint">كل لاعب يبدأ بـ 10 ❤️ و3 موارد.</p>
    </section>
  </div></main>`;
  document.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{state.playerCount=+b.dataset.count;render()});
  document.getElementById("start").onclick=start;
}

async function start(){
  state.screen="game";state.round=1;state.phase="event";state.logs=[];state.error="";
  state.players=Array.from({length:state.playerCount},(_,i)=>({id:i+1,name:"اللاعب "+(i+1),hp:10,resources:3,cards:[],alive:true}));
  await newEvent();
}

function game(){
  const title={event:"حدث الجولة",secret:"الفعل السري",accuse:"جولة الاتهام",cards:"اختيار البطاقات",end:"نهاية الجولة"}[state.phase]||"";
  app.innerHTML=`
  <main class="shell">
    <header class="topbar"><div><div class="round">الجولة ${state.round}</div><h1>${title}</h1></div><button class="btn" id="restart">إعادة</button></header>
    <section class="players">${state.players.map(p=>`<article class="player ${p.alive?"":"dead"}"><div class="player-name">${esc(p.name)}</div><div class="stats"><span>❤️ ${p.hp}</span><span>◆ ${p.resources}</span><span>🎴 ${p.cards.length}</span></div></article>`).join("")}</section>
    <section class="panel">${state.loading?loading():phase()}</section>
    ${state.logs.length?`<section class="panel log"><h3>سجل اللعبة</h3>${state.logs.slice(-10).reverse().map(x=>`<div class="log-item">${esc(x)}</div>`).join("")}</section>`:""}
  </main>`;
  document.getElementById("restart").onclick=()=>{state.screen="setup";state.players=[];state.logs=[];state.error="";render()};
  bind();
}

function loading(){return `<div class="loading"><div><div class="dots"><i></i><i></i><i></i></div><div class="muted">الذكاء الاصطناعي يدير الجولة...</div></div></div>`}

function phase(){
  if(state.phase==="event"){
    const e=state.event||{};
    return `<div class="event"><div class="event-icon">⚡</div><h2>${esc(e.title||"حدث غامض")}</h2><p>${esc(e.story||"")}</p></div>
    <div class="clues">${(e.publicClues||[]).map(c=>`<div class="clue">🔎 ${esc(c)}</div>`).join("")}</div>
    ${e.twist?`<div class="notice">🎭 ${esc(e.twist)}</div>`:""}
    <div class="actions"><button class="btn primary full" id="beginSecret">بدء الأفعال السرية</button></div>`;
  }
  if(state.phase==="secret") return `<div class="event"><div class="event-icon">🔒</div><h2>تمرير الهاتف</h2><p>كل لاعب سيختار فعله سراً.</p><button class="btn primary full" id="nextPrivate">متابعة</button></div>`;
  if(state.phase==="accuse"){
    return `<h2>⚖️ اختاروا من سيتم اتهامه</h2><p class="muted">ناقشوا الحدث. الاتهام لا يعني أن المتهم جاسوس.</p><div class="targets">${alive().map(p=>`<button class="target" data-target="${p.id}"><strong>${esc(p.name)}</strong><span>❤️ ${p.hp} · ◆ ${p.resources}</span></button>`).join("")}</div>`;
  }
  if(state.phase==="cards"){
    const cs=[["🛡️","درع"],["💰","مورد"],["🕵️","معلومة"],["⚔️","سلاح"],["🎭","خدعة"],["☠️","مخاطرة"]];
    return `<h2>🎴 جولة الاختيار</h2><p class="muted">اختر بطاقة أو استخدم مواردك بدلاً منها.</p><div class="cards">${cs.map((c,i)=>`<button class="card" data-card="${i}"><strong style="font-size:28px">${c[0]}</strong><span>${c[1]}</span><small class="muted">مخفية</small></button>`).join("")}</div><div class="actions"><button class="btn danger full" id="attackInstead">⚔️ أستخدم مورداً بدل البطاقة</button></div>`;
  }
  if(state.phase==="end"){
    const a=alive();
    if(a.length<=1) return `<div class="event"><div class="event-icon">👑</div><h2>انتهت اللعبة</h2><p>${a[0]?`الفائز هو ${esc(a[0].name)}!`:"لا يوجد فائز."}</p></div><button class="btn primary full" id="newGame">لعبة جديدة</button>`;
    return `<div class="event"><div class="event-icon">🌙</div><h2>انتهت الجولة</h2><p>الآن يمكن بدء الجولة التالية.</p></div><button class="btn primary full" id="nextRound">بدء الجولة التالية</button>`;
  }
}

function bind(){
  document.getElementById("beginSecret")?.addEventListener("click",()=>{state.phase="secret";state.currentPlayerIndex=0;render()});
  document.getElementById("nextPrivate")?.addEventListener("click",()=>{state.screen="private";render()});
  document.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>accuse(+b.dataset.target));
  document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>card(+b.dataset.card));
  document.getElementById("attackInstead")?.addEventListener("click",()=>{state.screen="private";render()});
  document.getElementById("nextRound")?.addEventListener("click",nextRound);
  document.getElementById("newGame")?.addEventListener("click",()=>{state.screen="setup";state.players=[];render()});
}

function privateScreen(){
  const a=alive(); if(!a.length){state.screen="game";state.phase="end";return render()}
  const p=a[state.currentPlayerIndex%a.length];
  app.innerHTML=`<main class="private-screen"><section class="private-box">
    <div class="private-icon">🔒</div><div class="eyebrow">سري — ${esc(p.name)}</div><h1 style="font-size:34px">${esc(p.name)}</h1><p class="muted">لا تجعل الآخرين يرون الشاشة.</p>
    <div class="private-actions">
      <button class="private-action" data-action="attack"><strong>⚔️ إيذاء لاعب</strong><small>يتطلب مورداً.</small></button>
      <button class="private-action" data-action="protect"><strong>🛡️ حماية</strong><small>جهز درعاً سرياً.</small></button>
      <button class="private-action" data-action="hint"><strong>🕵️ تلميح</strong><small>أنفق مورداً لمعرفة شيء.</small></button>
      <button class="private-action" data-action="alliance"><strong>🤝 تحالف</strong><small>احصل على منفعة سرية.</small></button>
      <button class="private-action" data-action="save"><strong>🎴 احتفظ</strong><small>لا تفعل شيئاً.</small></button>
    </div></section></main>`;
  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>privateAction(b.dataset.action));
}

function privateAction(action){
  const a=alive(),p=a[state.currentPlayerIndex%a.length];

  if(action==="attack"){
    if(p.resources<1) return alert("لا تملك مورداً كافياً.");
    const targets=a.filter(x=>x.id!==p.id);
    app.innerHTML=`<main class="private-screen"><section class="private-box"><div class="private-icon">⚔️</div><h1 style="font-size:32px">اختر الهدف</h1><div class="private-actions">${targets.map(t=>`<button class="private-action" data-atk="${t.id}"><strong>${esc(t.name)}</strong><small>❤️ ${t.hp}</small></button>`).join("")}</div></section></main>`;
    document.querySelectorAll("[data-atk]").forEach(b=>b.onclick=()=>{
      const t=state.players.find(x=>x.id===+b.dataset.atk);
      p.resources--;t.hp=Math.max(0,t.hp-2);if(t.hp===0)eliminate(t);
      state.logs.push("⚔️ حدث إيذاء سري.");finishSecret();
    });
    return;
  }

  if(action==="protect"){
    if(p.resources<1)return alert("لا تملك مورداً كافياً.");
    p.resources--;p.cards.push({name:"درع"});state.logs.push(p.name+" جهز حماية سرية.");
  }else if(action==="hint"){
    if(p.resources<1)return alert("لا تملك مورداً كافياً.");
    p.resources--;alert((state.event?.publicClues||["هناك معلومة مخفية."])[0]);state.logs.push("🕵️ استخدم لاعب مورداً للحصول على تلميح.");
  }else if(action==="alliance"){
    p.resources++;state.logs.push("🤝 تم إنشاء منفعة تحالف سرية.");
  }else{
    state.logs.push(p.name+" احتفظ بموارده.");
  }
  finishSecret();
}

function finishSecret(){
  state.currentPlayerIndex++;
  state.screen="game";
  if(state.currentPlayerIndex>=alive().length){state.currentPlayerIndex=0;state.phase="accuse"}else state.phase="secret";
  render();
}

async function accuse(id){
  const t=state.players.find(p=>p.id===id);if(!t||!t.alive)return;
  state.loading=true;render();
  try{
    const r=await callAI({
      task:"accusation_result",
      game:{
        round:state.round,event:state.event,
        players:state.players.map(p=>({id:p.id,hp:p.hp,resources:p.resources,cards:p.cards.map(c=>c.name)}))
      },
      player:{accusedId:id}
    });
    const dmg=Number(r.damage??2),reward=Number(r.reward??0);
    const shield=t.cards.findIndex(c=>c.name==="درع");
    if(shield>=0){t.cards.splice(shield,1);t.hp=Math.min(10,t.hp+1);state.logs.push("🛡️ "+t.name+" نجا من الاتهام.");}
    else{t.hp=Math.max(0,t.hp-dmg);state.logs.push("⚖️ "+t.name+" خسر "+dmg+" نقاط.");}
    if(reward>0){const b=alive().filter(x=>x.id!==t.id).sort((x,y)=>y.resources-x.resources)[0];if(b){b.resources+=reward;state.logs.push("💰 حصل لاعب مستفيد على موارد.");}}
    if(t.hp===0)eliminate(t);
  }catch(e){
    t.hp=Math.max(0,t.hp-2);state.logs.push("⚖️ تم تنفيذ الاتهام بنتيجة احتياطية.");if(t.hp===0)eliminate(t);
  }
  state.loading=false;state.phase="cards";render();
}

function card(i){
  const a=alive();if(!a.length){state.phase="end";return render()}
  const p=a[Math.floor(Math.random()*a.length)];
  if(i===0){p.cards.push({name:"درع"});state.logs.push("🛡️ حصل لاعب على درع.")}
  if(i===1){p.resources+=2;state.logs.push("💰 ظهر مورد جديد.")}
  if(i===2){state.logs.push("🕵️ ظهرت معلومة جديدة.")}
  if(i===3){p.resources=Math.max(0,p.resources-1);state.logs.push("⚔️ بطاقة استنزفت مورداً.")}
  if(i===4){p.cards.push({name:"خدعة"});state.logs.push("🎭 دخلت بطاقة خدعة.")}
  if(i===5){p.hp=Math.max(0,p.hp-1);state.logs.push("☠️ بطاقة مخاطرة أضرت بلاعب.");if(p.hp===0)eliminate(p)}
  state.phase="end";render();
}

function eliminate(p){p.alive=false;p.hp=0;state.logs.push("☠️ خرج "+p.name+" من اللعبة.")}

async function nextRound(){
  state.round++;state.phase="event";state.currentPlayerIndex=0;alive().forEach(p=>p.resources++);
  await newEvent();
}

async function newEvent(){
  state.loading=true;state.error="";render();
  try{
    state.event=await callAI({task:"new_event",game:{round:state.round,players:state.players.map(p=>({id:p.id,hp:p.hp,resources:p.resources,alive:p.alive})),recentLog:state.logs.slice(-8)}});
  }catch(e){
    state.error=e.message;
    state.event={title:"حادث غامض",story:"حدث شيء غير متوقع، وظهرت مصالح متعارضة.",publicClues:["أحد اللاعبين استفاد من الفوضى.","هناك معلومة ناقصة."],twist:"لا تفترضوا أن المستفيد هو المتسبب."};
  }
  state.loading=false;render();
}

async function callAI(payload){
  const r=await fetch("/api/game",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok)throw new Error(d?.error||"فشل الاتصال بالذكاء الاصطناعي.");
  return d.result;
}

render();
</script>
</body>
</html>
